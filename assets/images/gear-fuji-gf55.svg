<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <radialGradient id="fujiLensBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="70%" stop-color="#141a22"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <linearGradient id="barrelGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#181d24"/>
      <stop offset="25%" stop-color="#2c3440"/>
      <stop offset="50%" stop-color="#3e4958"/>
      <stop offset="75%" stop-color="#282f3a"/>
      <stop offset="100%" stop-color="#12161c"/>
    </linearGradient>
    <radialGradient id="glassCoating" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2ec4b6" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#3a86ff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#7209b7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#03071e" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="600" height="375" fill="url(#fujiLensBg)"/>
  <ellipse cx="300" cy="315" rx="160" ry="20" fill="#000" opacity="0.6" filter="blur(10px)"/>

  <!-- Lens Assembly (Frontal 3/4 Perspective) -->
  <g transform="translate(160, 60)">
    <!-- Base Mount Ring -->
    <rect x="50" y="210" width="180" height="25" rx="3" fill="#2d333b" stroke="#4a5568"/>
    <rect x="70" y="235" width="140" height="8" rx="2" fill="#718096"/>
    
    <!-- Aperture Ring -->
    <rect x="40" y="170" width="200" height="40" rx="3" fill="url(#barrelGradient)" stroke="#4a5568"/>
    <text x="65" y="194" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#e76f51">A</text>
    <text x="95" y="194" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#f0ead8">1.7</text>
    <text x="125" y="194" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#f0ead8">2.8</text>
    <text x="155" y="194" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#f0ead8">4</text>
    <text x="180" y="194" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#f0ead8">5.6</text>
    <text x="210" y="194" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#f0ead8">8</text>
    <line x1="40" y1="178" x2="240" y2="178" stroke="#333d4b" stroke-width="1"/>

    <!-- Focus Ring with Rubber Ribbing -->
    <rect x="30" y="75" width="220" height="95" rx="4" fill="url(#barrelGradient)" stroke="#4a5568"/>
    <!-- Rubber ridges -->
    <g stroke="#1a202c" stroke-width="2.5">
      <line x1="45" y1="85" x2="45" y2="160"/>
      <line x1="60" y1="85" x2="60" y2="160"/>
      <line x1="75" y1="85" x2="75" y2="160"/>
      <line x1="90" y1="85" x2="90" y2="160"/>
      <line x1="105" y1="85" x2="105" y2="160"/>
      <line x1="120" y1="85" x2="120" y2="160"/>
      <line x1="135" y1="85" x2="135" y2="160"/>
      <line x1="150" y1="85" x2="150" y2="160"/>
      <line x1="165" y1="85" x2="165" y2="160"/>
      <line x1="180" y1="85" x2="180" y2="160"/>
      <line x1="195" y1="85" x2="195" y2="160"/>
      <line x1="210" y1="85" x2="210" y2="160"/>
      <line x1="225" y1="85" x2="225" y2="160"/>
    </g>

    <!-- Front Element Ring / Filter Thread -->
    <ellipse cx="140" cy="75" rx="110" ry="42" fill="url(#barrelGradient)" stroke="#4a5568" stroke-width="2"/>
    <ellipse cx="140" cy="75" rx="98" ry="36" fill="#12161c" stroke="#2d3748" stroke-width="2"/>
    
    <!-- Massive Curved Front Glass Element with Coating Reflections -->
    <ellipse cx="140" cy="75" rx="86" ry="30" fill="url(#glassCoating)"/>
    
    <!-- Circular Aperture Blades deep inside -->
    <ellipse cx="140" cy="75" rx="42" ry="15" fill="#000" stroke="#c8911a" stroke-width="1.2" stroke-dasharray="14 4"/>
    
    <!-- Front Ring Engraved Typography -->
    <path id="lensCurve" d="M 60 70 A 80 25 0 0 1 220 70" fill="none"/>
    <text font-family="'Space Grotesk', system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#cbd5e0" letter-spacing="1.5">
      <textPath href="#lensCurve" startOffset="50%" text-anchor="middle">
        FUJINON LENS GF 55mm 1:1.7 R WR Ø77
      </textPath>
    </text>

    <!-- Glass curved specular highlight -->
    <path d="M75 75 Q140 50 205 75" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45"/>
    <circle cx="160" cy="68" r="8" fill="#fff" opacity="0.25" filter="blur(2px)"/>
  </g>

  <text x="300" y="352" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="500" fill="#8898aa" text-anchor="middle" letter-spacing="3">MEDIUM FORMAT f/1.7 · NANO GI COATING · 11 BLADES</text>
</svg>
