<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <radialGradient id="bagStudioBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3d372e"/>
      <stop offset="65%" stop-color="#24201a"/>
      <stop offset="100%" stop-color="#14120e"/>
    </radialGradient>
    <linearGradient id="waxedCanvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8c7a5b"/>
      <stop offset="40%" stop-color="#7a684b"/>
      <stop offset="80%" stop-color="#67563c"/>
      <stop offset="100%" stop-color="#55462f"/>
    </linearGradient>
    <linearGradient id="leatherStrap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a2e18"/>
      <stop offset="50%" stop-color="#694326"/>
      <stop offset="100%" stop-color="#3e2513"/>
    </linearGradient>
    <linearGradient id="brassBuckle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecd189"/>
      <stop offset="60%" stop-color="#c89d3c"/>
      <stop offset="100%" stop-color="#8c6a1e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="375" fill="url(#bagStudioBg)"/>
  <ellipse cx="300" cy="320" rx="190" ry="22" fill="#000" opacity="0.65" filter="blur(12px)"/>

  <!-- Wotancraft Pilot 10L Bag Profile -->
  <g transform="translate(140, 70)">
    <!-- Main Bag Body -->
    <rect x="25" y="55" width="270" height="175" rx="14" fill="url(#waxedCanvas)" stroke="#4a3c28" stroke-width="2"/>
    
    <!-- Side expanding pockets -->
    <rect x="12" y="90" width="16" height="110" rx="4" fill="#67563c" stroke="#4a3c28"/>
    <rect x="292" y="90" width="16" height="110" rx="4" fill="#67563c" stroke="#4a3c28"/>

    <!-- Front Weather Flap -->
    <path d="M 22 55 Q 160 62 298 55 L 292 165 Q 160 185 28 165 Z" fill="url(#waxedCanvas)" stroke="#3e311f" stroke-width="2"/>
    
    <!-- Canvas weathered crinkles & stitch lines -->
    <path d="M 32 68 Q 160 74 288 68" fill="none" stroke="#b09f7a" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.65"/>
    <path d="M 36 155 Q 160 173 284 155" fill="none" stroke="#b09f7a" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.65"/>

    <!-- Leather Vertical Straps -->
    <!-- Left Strap -->
    <rect x="80" y="45" width="22" height="165" rx="3" fill="url(#leatherStrap)" stroke="#2b1a0e"/>
    <line x1="84" y1="48" x2="84" y2="206" stroke="#b09f7a" stroke-width="0.8" stroke-dasharray="4 2"/>
    <line x1="98" y1="48" x2="98" y2="206" stroke="#b09f7a" stroke-width="0.8" stroke-dasharray="4 2"/>
    <!-- Left Antique Brass Buckle -->
    <rect x="75" y="160" width="32" height="24" rx="4" fill="url(#brassBuckle)" stroke="#523e12" stroke-width="1"/>
    <rect x="83" y="166" width="16" height="12" rx="2" fill="#2b1a0e"/>
    <line x1="91" y1="160" x2="91" y2="184" stroke="#523e12" stroke-width="2"/>

    <!-- Right Strap -->
    <rect x="218" y="45" width="22" height="165" rx="3" fill="url(#leatherStrap)" stroke="#2b1a0e"/>
    <line x1="222" y1="48" x2="222" y2="206" stroke="#b09f7a" stroke-width="0.8" stroke-dasharray="4 2"/>
    <line x1="236" y1="48" x2="236" y2="206" stroke="#b09f7a" stroke-width="0.8" stroke-dasharray="4 2"/>
    <!-- Right Antique Brass Buckle -->
    <rect x="213" y="160" width="32" height="24" rx="4" fill="url(#brassBuckle)" stroke="#523e12" stroke-width="1"/>
    <rect x="221" y="166" width="16" height="12" rx="2" fill="#2b1a0e"/>
    <line x1="229" y1="160" x2="229" y2="184" stroke="#523e12" stroke-width="2"/>

    <!-- Center Leather Logo Patch -->
    <rect x="135" y="105" width="50" height="26" rx="3" fill="url(#leatherStrap)" stroke="#2b1a0e"/>
    <text x="160" y="122" font-family="'Space Grotesk', system-ui, sans-serif" font-size="7" font-weight="800" fill="#ecd189" text-anchor="middle" letter-spacing="1">WOTANCRAFT</text>
    
    <!-- Top Carry Handle -->
    <path d="M 115 55 Q 160 25 205 55" fill="none" stroke="url(#leatherStrap)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 125 54 Q 160 32 195 54" fill="none" stroke="#2b1a0e" stroke-width="2"/>
  </g>

  <text x="300" y="352" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="500" fill="#b09f7a" text-anchor="middle" letter-spacing="3">WAXED CORDURA 500D · YKK WATERPROOF · MODULAR 10L</text>
</svg>
