<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <radialGradient id="sonyBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a3348"/>
      <stop offset="60%" stop-color="#182030"/>
      <stop offset="100%" stop-color="#0e1420"/>
    </radialGradient>
    <radialGradient id="sensorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38a3a5" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1d3557" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0a1128" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="bodyMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c212a"/>
      <stop offset="25%" stop-color="#2c3340"/>
      <stop offset="50%" stop-color="#3d4655"/>
      <stop offset="75%" stop-color="#252b36"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="orangeStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d46a1a"/>
      <stop offset="50%" stop-color="#e76f51"/>
      <stop offset="100%" stop-color="#b85010"/>
    </linearGradient>
  </defs>
  
  <!-- Backdrop studio plate -->
  <rect width="600" height="375" fill="url(#sonyBg)"/>
  
  <!-- Subtle surface shadow -->
  <ellipse cx="300" cy="320" rx="190" ry="22" fill="#000" opacity="0.55" filter="blur(10px)"/>
  
  <!-- Camera Body Silhouettes -->
  <g transform="translate(140, 75)">
    <!-- Main magnesium body -->
    <rect x="20" y="45" width="280" height="180" rx="14" fill="url(#bodyMetal)" stroke="#4a5568" stroke-width="1.5"/>
    
    <!-- Grip -->
    <path d="M20 50 Q5 90 8 180 Q10 220 30 225 L35 225 L35 48 Z" fill="#181d24" stroke="#333d4b" stroke-width="1"/>
    <!-- Grip leatherette texture lines -->
    <line x1="16" y1="70" x2="28" y2="70" stroke="#252c38" stroke-width="2"/>
    <line x1="15" y1="90" x2="28" y2="90" stroke="#252c38" stroke-width="2"/>
    <line x1="16" y1="110" x2="28" y2="110" stroke="#252c38" stroke-width="2"/>
    <line x1="18" y1="130" x2="28" y2="130" stroke="#252c38" stroke-width="2"/>
    <line x1="20" y1="150" x2="28" y2="150" stroke="#252c38" stroke-width="2"/>
    <line x1="22" y1="170" x2="28" y2="170" stroke="#252c38" stroke-width="2"/>

    <!-- EVF Prism Hump -->
    <path d="M125 45 L145 15 L185 15 L205 45 Z" fill="#252c37" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="150" y="8" width="30" height="7" rx="2" fill="#141820" stroke="#4a5568"/>
    
    <!-- Dials top plate -->
    <rect x="55" y="32" width="40" height="14" rx="2" fill="#2c3442" stroke="#4a5568"/>
    <rect x="235" y="30" width="45" height="16" rx="2" fill="#2c3442" stroke="#4a5568"/>
    <ellipse cx="270" cy="30" rx="12" ry="5" fill="#3a4556"/>

    <!-- Sony Iconic Orange E-Mount Collar Ring -->
    <circle cx="165" cy="135" r="76" fill="none" stroke="url(#orangeStripe)" stroke-width="5"/>
    <circle cx="165" cy="135" r="72" fill="#181d24" stroke="#4a5568" stroke-width="2"/>
    
    <!-- Chrome Bayonet Tabs -->
    <circle cx="165" cy="135" r="62" fill="none" stroke="#718096" stroke-width="4" stroke-dasharray="28 15 28 15 28 15"/>
    
    <!-- Full-Frame Sensor Well with Cyan/Teal Iridescence -->
    <rect x="127" y="108" width="76" height="54" rx="3" fill="url(#sensorGlow)" stroke="#c8911a" stroke-width="1.2"/>
    <rect x="131" y="112" width="68" height="46" rx="1.5" fill="#0b1728" opacity="0.6"/>
    <!-- Sensor reflection slash -->
    <path d="M135 155 L165 110 L175 110 L145 155 Z" fill="#fff" opacity="0.18"/>
    
    <!-- Details: Logo, α7R V typography -->
    <text x="165" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f0ead8" text-anchor="middle" letter-spacing="2">SONY</text>
    <text x="48" y="70" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" font-weight="700" fill="#e76f51" letter-spacing="1">α7R</text>
    <text x="73" y="70" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8" font-weight="600" fill="#a0aec0">V</text>
    
    <!-- AF Assist Lamp -->
    <circle cx="218" cy="72" r="5" fill="#202834" stroke="#4a5568"/>
    <circle cx="218" cy="72" r="2.5" fill="#e76f51" opacity="0.8"/>
  </g>
  
  <!-- Studio Rim Light Accent -->
  <path d="M140 285 L460 285" stroke="#c8911a" stroke-width="1" opacity="0.35"/>
  <text x="300" y="352" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="500" fill="#8898aa" text-anchor="middle" letter-spacing="3">61.0 MEGAPIXELS · 5-AXIS IBIS · WEATHER SEALED</text>
</svg>
