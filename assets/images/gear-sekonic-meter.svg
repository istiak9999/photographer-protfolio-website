<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <radialGradient id="sekonicBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#28323f"/>
      <stop offset="70%" stop-color="#161d26"/>
      <stop offset="100%" stop-color="#0c1117"/>
    </radialGradient>
    <linearGradient id="meterBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2028"/>
      <stop offset="25%" stop-color="#2a3340"/>
      <stop offset="50%" stop-color="#384454"/>
      <stop offset="75%" stop-color="#252c36"/>
      <stop offset="100%" stop-color="#14181f"/>
    </linearGradient>
    <radialGradient id="whiteSphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <linearGradient id="lcdScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#809b80"/>
      <stop offset="100%" stop-color="#678067"/>
    </linearGradient>
  </defs>

  <rect width="600" height="375" fill="url(#sekonicBg)"/>
  <ellipse cx="300" cy="320" rx="140" ry="18" fill="#000" opacity="0.6" filter="blur(10px)"/>

  <!-- Sekonic L-308X Body -->
  <g transform="translate(210, 50)">
    <!-- Main Handheld Body with Ergonomic Curves -->
    <rect x="25" y="45" width="130" height="210" rx="20" fill="url(#meterBody)" stroke="#4a5568" stroke-width="1.5"/>

    <!-- Lumisphere Dome (White Sphere on top) -->
    <circle cx="90" cy="45" r="24" fill="url(#whiteSphere)" stroke="#cbd5e0" stroke-width="1.5"/>
    <ellipse cx="82" cy="38" rx="8" ry="5" fill="#fff" opacity="0.6"/>
    <!-- Dome rotating collar track -->
    <path d="M60 45 L120 45" stroke="#334155" stroke-width="3"/>

    <!-- Sekonic Logo -->
    <text x="90" y="85" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">SEKONIC</text>
    <text x="90" y="98" font-family="'Space Grotesk', system-ui, sans-serif" font-size="7" font-weight="600" fill="#c8911a" text-anchor="middle" letter-spacing="1">FLASHMATE L-308X</text>

    <!-- LCD Display Screen (Backlit Greenish Tint) -->
    <rect x="42" y="106" width="96" height="58" rx="6" fill="url(#lcdScreen)" stroke="#2d3748" stroke-width="2"/>
    <rect x="45" y="109" width="90" height="52" rx="4" fill="#000" opacity="0.08"/>
    
    <!-- LCD Digits & Readouts -->
    <text x="52" y="124" font-family="monospace" font-size="8" font-weight="700" fill="#1b2e1b">ISO 400</text>
    <text x="52" y="148" font-family="'Space Grotesk', monospace" font-size="22" font-weight="800" fill="#0f1c0f">1/250</text>
    <text x="126" y="148" font-family="'Space Grotesk', monospace" font-size="16" font-weight="800" fill="#0f1c0f" text-anchor="end">F 4.0</text>
    <text x="126" y="124" font-family="monospace" font-size="7" font-weight="700" fill="#1b2e1b" text-anchor="end">0.3 EV</text>

    <!-- Measure Button on Side -->
    <rect x="14" y="95" width="12" height="36" rx="4" fill="#1e2530" stroke="#4a5568"/>
    
    <!-- Face keypad buttons -->
    <circle cx="60" cy="188" r="9" fill="#1f2530" stroke="#4a5568"/>
    <text x="60" y="191" font-family="'Space Grotesk', system-ui" font-size="7" font-weight="700" fill="#cbd5e0" text-anchor="middle">MODE</text>
    
    <circle cx="90" cy="188" r="9" fill="#1f2530" stroke="#4a5568"/>
    <text x="90" y="191" font-family="'Space Grotesk', system-ui" font-size="7" font-weight="700" fill="#cbd5e0" text-anchor="middle">ISO</text>
    
    <circle cx="120" cy="188" r="9" fill="#1f2530" stroke="#4a5568"/>
    <text x="120" y="191" font-family="'Space Grotesk', system-ui" font-size="7" font-weight="700" fill="#cbd5e0" text-anchor="middle">▲</text>

    <!-- Up/Down buttons -->
    <rect x="75" y="212" width="30" height="18" rx="4" fill="#1f2530" stroke="#4a5568"/>
    <text x="90" y="224" font-family="'Space Grotesk', system-ui" font-size="8" font-weight="700" fill="#e2a82b" text-anchor="middle">POWER</text>
  </g>

  <text x="300" y="352" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="500" fill="#8898aa" text-anchor="middle" letter-spacing="3">INCIDENT LUMISPHERE · 1/10TH STOP ACCURACY · AMBIENT/FLASH</text>
</svg>
